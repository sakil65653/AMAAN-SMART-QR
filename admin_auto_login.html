<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<script>
(async () => {
    const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'admin', password: '9078' })
    });
    const d = await res.json();
    if (d.success && d.token) {
        localStorage.setItem('amaan_admin_token', d.token);
        localStorage.setItem('amaan_csc_user', JSON.stringify(d.user));
        window.location.href = 'admin.html';
    }
})();
</script>
</body>
</html>
